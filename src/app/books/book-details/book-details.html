<form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">
  <label class="form-label" for="id">ID:</label>
  <input class="form-entry" readonly type="text" id="id" name="id" [(ngModel)]="book.id">

  <label class="form-label" for="title">Title:</label>
  <input class="form-entry" type="text" id="title" name="title" [(ngModel)]="book.title" required>

  <label class="form-label" for="publicationYear">Publication Year:</label>
  <input class="form-entry" type="number" id="publicationYear" name="publicationYear" [(ngModel)]="book.publicationYear" required>

  <mat-form-field>
    <mat-label class="form-label" for="author" multiple>Authors</mat-label>
    <mat-select class="form-entry" [ngModel]="book.authors" multiple>
      @for (author of allAuthors$ | async; track author) {
        <mat-option [value]="author">{{author.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-select class="form-entry" [(ngModel)]="book.authors" multiple>
    @for (author of allAuthors$ | async; track author) {
      <mat-option [value]="author">{{ author.name }}</mat-option>
    }
  </mat-select>

  <button type="submit" [disabled]="userForm.invalid">Submit</button>
  <button type="button" (click)="onCancel()">Cancel</button>
</form>
