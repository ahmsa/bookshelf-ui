@if (books$ | async; as books) {
  <!-- This block is displayed when the data arrives -->
  <a (click)="onBookDetails(null)" class="button">Add Book</a>
  <p-table [value]="books">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Publication Year</th>
        <th>Authors</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-book>
      <tr>
        <td>
          <a (click)="onBookDetails(book)">
            {{book.id}}
          </a>
        </td>
        <td>{{book.title}}</td>
        <td>{{book.publicationYear}}</td>
        <td>
          @for (author of book.authors; track author;) {
            @if(!$first){
              {{", "}}
            }
            {{author.name}}
          }
        </td>
        <td>
          <button class="button" (click)="delete(book.id)">Delete</button>
        </td>
      </tr>
    </ng-template>
  </p-table>

} @else {
  <!-- This block is displayed while the data is loading -->
  <div>Loading items...</div>
}
