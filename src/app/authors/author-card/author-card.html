<form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">
  <label class="form-label" for="id">ID:</label>
  <input class="form-entry" readonly type="text" id="id" name="id" [(ngModel)]="author.id">

  <label class="form-label" for="name">Name:</label>
  <input class="form-entry" type="text" id="name" name="name" [(ngModel)]="author.name" required>

  <label class="form-label" for="country">Country:</label>
  <input class="form-entry" type="text" id="country" name="country" [(ngModel)]="author.country" required>

  <button type="submit" [disabled]="userForm.invalid">Submit</button>
  <button type="button" (click)="onCancel()">Cancel</button>
</form>
