@if (authors$ | async; as authors) {
  <!-- This block is displayed when the data arrives -->
  <a routerLink="/authorDetails" class="button">Add Author</a>
  <p-table [value]="authors">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Country</th>
        <th>books</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-author>
      <tr>
        <td>
          <a routerLink="/authorDetails/{{author.id}}">
            {{author.id}}
          </a>
        </td>
        <td>{{author.name}}</td>
        <td>{{author.country}}</td>
        <td>
          {{ author.books?.length }}
        </td>
        <td>
          <button class="button" (click)="delete(author.id)">Delete</button>
        </td>
      </tr>
    </ng-template>
  </p-table>

} @else {
  <!-- This block is displayed while the data is loading -->
  <div>Loading items...</div>
}
