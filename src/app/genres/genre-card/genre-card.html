<form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">
  <label class="form-label" for="id">ID:</label>
  <input class="form-entry" readonly type="text" id="id" name="id" [(ngModel)]="genre.id">

  <label class="form-label" for="name">Name:</label>
  <input class="form-entry" type="text" id="name" name="name" [(ngModel)]="genre.name" required>

  <label class="form-label" for="parent">Parent Genre:</label>

  <p-select
    class="form-entry"
    [options]="allGenresExculdingCurrent"
    [(ngModel)]="genre.parentGenre"
    name="parentGenre"
    optionLabel="Parent Genre"
    placeholder="Select Parent Genre">
  </p-select>

  <button type="submit" [disabled]="userForm.invalid">Submit</button>
  <button type="button" (click)="onCancel()">Cancel</button>
</form>
