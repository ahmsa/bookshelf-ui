@if(genres$ | async; as generes) {
  <a routerLink="/genreDetails" class="button">Add Genre</a>

  <p-table [value]="generes">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Parent Genre</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-genre >
      <tr>
        <td><a routerLink="/authorDetails/{{genre.id}}">{{ genre.id }}</a></td>
        <td>{{ genre.name }}</td>
        <td>{{ genre.parentGenre?.name }}</td>
        <td>
          <button class="button" (click)="delete(genre.id)">Delete</button>
      </tr>
    </ng-template>
  </p-table>
} @else {
  <p>Loading genres...</p>
}
