@if(genres$ | async; as generes) {
  <a routerLink="/genreDetails" class="button">Add Genre</a>

  <p-table [value]="generes">
    <ng-template pTemplate="header">
      <tr>
      <th>ID</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-genre >
      <tr>
        <td><a routerLink="/authorDetails/{{genre.id}}">{{ genre.id }}</a></td>
      </tr>
    </ng-template>
  </p-table>
} @else {
  <p>Loading genres...</p>
}
